name: Swift
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build (Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "26.5"
            runner: macos-26
            destination: "platform=iOS Simulator,OS=26.5,arch=arm64,name=iPhone 17 Pro"
          # `xcode-27` is a preview runner image (macOS 27): https://github.com/actions/runner-images/issues/14404
          - xcode: "27.1"
            runner: xcode-27
            destination: "platform=iOS Simulator,OS=27.0,arch=arm64,name=iPhone 18 Pro"

    env:
      XCODE_SCHEME: "PUSDK-Package"
      XCODE_DESTINATION: ${{ matrix.destination }}

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Set Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

    - name: Checkout the code
      uses: actions/checkout@v7

    - name: Show versions
      run: |
        swift --version
        xcodebuild -version

    - name: Build
      run: |
        swift package resolve
        make generate_mocks
        xcodebuild -scheme ${{env.XCODE_SCHEME}} \
                   -destination '${{env.XCODE_DESTINATION}}' \
                   build

  tests:
    name: Tests (Xcode ${{ matrix.xcode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - xcode: "26.5"
            runner: macos-26
            destination: "platform=iOS Simulator,OS=26.5,arch=arm64,name=iPhone 17 Pro"
          # `xcode-27` is a preview runner image (macOS 27): https://github.com/actions/runner-images/issues/14404
          - xcode: "27.1"
            runner: xcode-27
            destination: "platform=iOS Simulator,OS=27.0,arch=arm64,name=iPhone 18 Pro"

    env:
      XCODE_SCHEME: "PUSDK-Package"
      XCODE_DESTINATION: ${{ matrix.destination }}

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Set Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

    - name: Checkout the code
      uses: actions/checkout@v7

    - name: Show versions
      run: |
        swift --version
        xcodebuild -version

    - name: Run tests
      run: |
        swift package resolve
        make generate_mocks
        xcodebuild -scheme ${{env.XCODE_SCHEME}} \
                   -destination '${{env.XCODE_DESTINATION}}' \
                   -testLanguage en \
                   -testRegion en_US \
                   test
